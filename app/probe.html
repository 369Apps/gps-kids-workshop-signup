<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>POST probe</title></head>
<body>
<div id="status">starting</div>
<script>
(function () {
  var status = document.getElementById("status");
  // Full field set mimicking a native form submission.
  var FBZX = "-5439539630092375028";
  var fields = {
    "entry.1755577904": "Probe Parent",
    "entry.222235729": "probe-20260917@example.com",
    "entry.2128729704": "GK-A1B2C3",
    "entry.1405261165": "GK-PROBE9",
    "fvv": "1",
    "fbzx": FBZX,
    "pageHistory": "0",
    "partialResponse": '[null,null,"' + FBZX + '"]',
    "submissionTimestamp": "-1"
  };
  var iframe = document.createElement("iframe");
  iframe.name = "probe_iframe";
  iframe.style.display = "none";
  var form = document.createElement("form");
  form.method = "POST";
  form.action = "https://docs.google.com/forms/d/e/1FAIpQLSfasXtI7ylt7MWxhmz8UU9yj84jyyhxqngrOkWL0Rftjrcl2A/formResponse";
  form.target = "probe_iframe";
  Object.keys(fields).forEach(function (k) {
    var inp = document.createElement("input");
    inp.type = "hidden"; inp.name = k; inp.value = fields[k];
    form.appendChild(inp);
  });
  iframe.onload = function () { status.textContent = "iframe loaded (POST completed)"; };
  document.body.appendChild(iframe);
  document.body.appendChild(form);
  form.submit();
  status.textContent = "POST fired at " + new Date().toISOString();
})();
</script>
</body></html>
